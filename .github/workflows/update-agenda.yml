name: Update agenda

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-agenda
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: read
    steps:
      - name: Check out main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Test with synthetic fixtures
        run: npm test

      - name: Fetch complete public agenda
        run: npm run scrape

      - name: Save raw capture for debugging
        if: ${{ always() && hashFiles('data/raw/agenda.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: raw-agenda-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/raw/agenda.json
          retention-days: 30
          if-no-files-found: error

      - name: Generate public exports
        run: npm run generate

      - name: Validate source and public agenda
        run: npm run validate

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Record public export changes on gh-pages
        run: npm run publish:agenda

      - name: Upload the published site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public

      - name: Summarize capture
        run: |
          node --input-type=module - <<'JS' >> "$GITHUB_STEP_SUMMARY"
          import { readFile } from 'node:fs/promises';
          const snapshot = JSON.parse(await readFile('data/raw/agenda.json', 'utf8'));
          console.log(`Captured: ${snapshot.scrapedAt}`);
          console.log(`Sessions: ${snapshot.counts.sessions}; speakers: ${snapshot.counts.speakers}.`);
          console.log(`Source SHA-256: ${snapshot.contentSha256}`);
          console.log('Public exports are recorded on gh-pages; raw capture retained as a debugging artifact for 30 days.');
          JS

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
