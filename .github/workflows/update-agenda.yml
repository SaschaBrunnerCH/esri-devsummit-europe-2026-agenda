name: Update agenda

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-agenda
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'

      - name: Test scraper
        run: npm test

      - name: Fetch complete public agenda
        run: npm run scrape

      - name: Commit changed source data
        run: |
          git add -- data/raw/agenda.json
          if git diff --cached --quiet; then
            echo "Agenda data unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "data: refresh Esri European Developer Summit agenda"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          echo "Updated data/raw/agenda.json." >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize capture
        run: |
          node --input-type=module - <<'JS' >> "$GITHUB_STEP_SUMMARY"
          import { readFile } from 'node:fs/promises';
          const snapshot = JSON.parse(await readFile('data/raw/agenda.json', 'utf8'));
          console.log(`Checked: ${new Date().toISOString()}`);
          console.log(`Data captured: ${snapshot.scrapedAt}`);
          console.log(`Catalogue entries: ${snapshot.counts.catalogEntries}; sessions: ${snapshot.counts.sessions}; speakers: ${snapshot.counts.speakers}.`);
          JS
